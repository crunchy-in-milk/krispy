name: Bug report
description: Create a bug report
labels:
  - bug
body:
  - type: checkboxes
    id: before-posting
    attributes:
      label: "This issue respects the following points:"
      description: All conditions are **required**.
      options:
        - label: I have reproduced this issue in Krispy and completed the relevant troubleshooting steps.
          required: true
        - label: This issue is **not** already reported on [GitHub](https://github.com/crunchy-in-milk/krispy/issues?q=is%3Aopen+is%3Aissue) _(I've searched it)_.
          required: true
        - label: I will keep the discussion respectful and provide any requested diagnostic information.
          required: true
        - label: This report addresses only one issue. I will create separate reports for unrelated issues.
          required: true
  - type: markdown
    attributes:
      value: |
        ## Bug information  
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: |
        A clear and concise description of the bug, including steps to reproduce it and the normally expected behavior.
        You can also attach screenshots or screen recordings to help explain your issue.
      placeholder: |
        1. Go to …
        2. Click on …
        3. Scroll down to …
        4. See error / the app crashes

        Instead, I expect …
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Please paste your crash logs here if applicable. You can find these in your servers dashboard under "logs".
        The file name should start with "upload_Krispy".
        Make sure that they don't contain any sensitive information like server URL, auth tokens or passwords.
      placeholder: Paste logs…
  - type: markdown
    attributes:
      value: |
        ## Environment
  - type: input
    id: app-version
    attributes:
      label: Application version
      description: The version of the installed Krispy app.
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: installation-source
    attributes:
      label: Where did you install the app from?
      description: Choose the appropriate app store or installation method.
      options:
        - GitHub Release
        - Locally built APK
        - Other sideloaded APK
  - type: input
    id: device-info
    attributes:
      label: Device information
      description: Manufacturer and model
      placeholder: Nvidia Shield TV Pro (2019), Fire TV Stick HD (2020)
    validations:
      required: true
  - type: input
    id: android-version
    attributes:
      label: Android version
      description: Version of the OS and other information (e.g. custom ROM / OEM skin)
      placeholder: Android 13, Fire OS 7
    validations:
      required: true
  - type: input
    id: server-version
    attributes:
      label: Jellyfin server version
      description: If on unstable, please specify the commit hash.
      placeholder: 10.10.2
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ## Additional
  - type: input
    id: other-sources
    attributes:
      label: Other sources
      description: Please link the related forum topics or chat messages that prompted you open this issue.
      placeholder: https://…
    validations:
      required: false
